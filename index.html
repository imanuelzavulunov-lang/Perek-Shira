    <!-- Single Loading Splash Screen -->

          <div style="font-family: 'Frank Ruhl Libre', serif; font-size: 32px; font-weight: 800; color: #fde68a; margin-bottom: 6px; letter-spacing: 0.025em;">פרק שירה</div>
          <div style="font-size: 15px; color: #cbd5e1; font-weight: 500;">טוען את האפליקציה...</div>
        </div>
        <!-- Spinner -->
        <div style="width: 30px; height: 30px; border: 3px solid rgba(253, 230, 138, 0.2); border-top-color: #fde68a; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const startTime = Date.now();
        const MIN_DISPLAY_TIME = 1500; // Display for at least 1.5 seconds for a pleasant loading feel

        function fadeOutSplash() {
          const splash = document.getElementById('initial-splash');
          if (!splash) return;

          const elapsed = Date.now() - startTime;
          const remaining = Math.max(0, MIN_DISPLAY_TIME - elapsed);

          setTimeout(function() {
            splash.style.transition = 'opacity 0.45s ease, visibility 0.45s ease';
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
              if (splash.parentNode) {
                splash.remove();
              }
            }, 450);
          }, remaining);
        }

        if (document.readyState === 'complete') {
          fadeOutSplash();
        } else {
          window.addEventListener('load', fadeOutSplash);
        }
      })();
    </script>
