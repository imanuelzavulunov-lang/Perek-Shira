    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="פרק שירה" />
    
    <!-- Open Graph / Facebook / Google Reader -->
    <meta property="og:type" content="article" />
    <meta property="og:title" content="פרק שירה - שירת הבריאה" />

    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="פרק שירה" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="פרק שירה - שירת הבריאה" />
    <meta name="twitter:description" content="פרק שירה המלא מנוקד ומבואר." />

    <!-- JSON-LD Article Schema for Search & Reader Engine Indexing -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": "פרק שירה - שירת הבריאה",
      "description": "פרק שירה הוא חיבור קצר המסוגנן בלשון חז\"ל המכיל קטעי שירה אותם שרות כל הבריות בשבח הקב\"ה.",
      "inLanguage": "he",
      "author": {
        "@type": "Organization",
        "name": "פרק שירה"
      }
    }
    </script>
  </head>
  <body class="bg-[#0f172a]">
    <!-- Single Loading Splash Screen - ONLY shown for installed PWA / Standalone App -->
    <div id="initial-splash" style="display: none; position: fixed; inset: 0; z-index: 9999; background-color: #0f172a; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; direction: rtl;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <!-- Logo with WHITE BORDER ONLY for loading screen -->
        <div style="width: 150px; height: 150px; border-radius: 24px; border: 4px solid #ffffff; box-shadow: 0 0 25px rgba(255, 255, 255, 0.35); overflow: hidden; background-color: #0f172a; padding: 8px; display: flex; align-items: center; justify-content: center;">
          <img src="/icon.png" alt="פרק שירה" style="width: 100%; height: 100%; object-fit: cover; border-radius: 16px;" />
        </div>
        <div style="text-align: center;">
          <div style="font-size: 28px; font-weight: 800; color: #fde68a; margin-bottom: 6px;">פרק שירה</div>
          <div style="font-size: 15px; color: #cbd5e1; font-weight: 500;">טוען את האפליקציה...</div>
        </div>
        <!-- Spinner -->
        <div style="width: 28px; height: 28px; border: 3px solid rgba(253, 230, 138, 0.2); border-top-color: #fde68a; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <script>
      (function() {
        // Detect if opened as an installed app (PWA / Standalone)
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                           window.navigator.standalone === true ||
                           document.referrer.includes('android-app://');
        var splash = document.getElementById('initial-splash');
        if (splash && isStandalone) {
          splash.style.display = 'flex';
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Smoothly hide splash screen once loaded if visible
      window.addEventListener('DOMContentLoaded', () => {
        const splash = document.getElementById('initial-splash');
        if (splash && splash.style.display !== 'none') {
          setTimeout(() => {
            splash.style.transition = 'opacity 0.35s ease';
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 350);
          }, 500);
        } else if (splash) {
          splash.remove();
        }
      });
    </script>
  </body>
</html>
